<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MERN POS - API Testing Tool</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      margin-bottom: 20px;
      text-align: center;
    }

    .header h1 {
      color: #667eea;
      margin-bottom: 10px;
    }

    .header p {
      color: #666;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .card h2 {
      color: #333;
      margin-bottom: 15px;
      font-size: 20px;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      color: #555;
      margin-bottom: 5px;
      font-weight: 500;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 5px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
      font-family: 'Courier New', monospace;
    }

    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .response {
      background: #f5f5f5;
      border: 2px solid #e0e0e0;
      border-radius: 5px;
      padding: 15px;
      margin-top: 15px;
      max-height: 400px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .response.success {
      border-color: #4caf50;
      background: #e8f5e9;
    }

    .response.error {
      border-color: #f44336;
      background: #ffebee;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .status.success {
      background: #4caf50;
      color: white;
    }

    .status.error {
      background: #f44336;
      color: white;
    }

    .quick-tests {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .quick-tests button {
      padding: 10px;
      font-size: 13px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .token-display {
      background: #fff3cd;
      border: 2px solid #ffc107;
      padding: 10px;
      border-radius: 5px;
      margin-top: 10px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🧪 MERN POS API Testing Tool</h1>
      <p>Test your API endpoints directly from the browser</p>
    </div>

    <div class="card full-width">
      <h2>🔐 Authentication</h2>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" value="admin" placeholder="Enter username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" value="admin123" placeholder="Enter password">
      </div>
      <button onclick="login()">Login</button>
      <div id="token-display"></div>
      <div id="login-response"></div>
    </div>

    <div class="card full-width">
      <h2>⚡ Quick Tests</h2>
      <div class="quick-tests">
        <button onclick="testEndpoint('GET', '/categories')">Get Categories</button>
        <button onclick="testEndpoint('GET', '/products')">Get Products</button>
        <button onclick="testEndpoint('GET', '/orders')">Get Orders</button>
        <button onclick="testEndpoint('GET', '/orders/today')">Today's Sales</button>
        <button onclick="testEndpoint('GET', '/analytics/summary')">Analytics Summary</button>
        <button onclick="testEndpoint('GET', '/analytics/dashboard')">Dashboard Snapshot</button>
        <button onclick="testEndpoint('GET', '/branches')">Get Branches</button>
        <button onclick="testEndpoint('GET', '/expenses')">Get Expenses</button>
        <button onclick="testEndpoint('GET', '/delivery/my-orders')">Delivery Orders</button>
        <button onclick="testEndpoint('GET', '/settings/profile')">Profile Settings</button>
        <button onclick="testEndpoint('GET', '/settings/storefront')">Storefront Settings</button>
        <button onclick="testEndpoint('GET', '/auth/users')">Get Users</button>
      </div>
      <div id="quick-response"></div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>🔧 Custom Request</h2>
        <div class="form-group">
          <label>Method</label>
          <select id="method">
            <option value="GET">GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="DELETE">DELETE</option>
          </select>
        </div>
        <div class="form-group">
          <label>Endpoint (e.g., /products)</label>
          <input type="text" id="endpoint" placeholder="/api/...">
        </div>
        <div class="form-group">
          <label>Request Body (JSON)</label>
          <textarea id="body" placeholder='{"key": "value"}'></textarea>
        </div>
        <button onclick="customRequest()">Send Request</button>
        <div id="custom-response"></div>
      </div>

      <div class="card">
        <h2>📊 Server Status</h2>
        <button onclick="checkStatus()">Check Backend Status</button>
        <div id="status-response"></div>
        
        <h2 style="margin-top: 20px;">🧹 Clear Cache</h2>
        <button onclick="clearCache()">Clear Browser Cache</button>
        <div id="cache-response"></div>
      </div>
    </div>
  </div>

  <script>
    const BASE_URL = 'http://localhost:5001/api';
    let token = localStorage.getItem('token') || '';

    // Display token if exists
    if (token) {
      displayToken(token);
    }

    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      try {
        const response = await fetch(`${BASE_URL}/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();
        
        if (data.token) {
          token = data.token;
          localStorage.setItem('token', token);
          displayToken(token);
          displayResponse('login-response', data, true);
        } else {
          displayResponse('login-response', data, false);
        }
      } catch (error) {
        displayResponse('login-response', { error: error.message }, false);
      }
    }

    function displayToken(token) {
      const tokenDisplay = document.getElementById('token-display');
      tokenDisplay.innerHTML = `
        <strong>🔑 Token:</strong><br>
        ${token.substring(0, 50)}...
        <br><small style="color: #666;">Token saved to localStorage</small>
      `;
      tokenDisplay.className = 'token-display';
    }

    async function testEndpoint(method, endpoint) {
      if (!token) {
        alert('Please login first!');
        return;
      }

      try {
        const response = await fetch(`${BASE_URL}${endpoint}`, {
          method: method,
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json',
          }
        });

        const data = await response.json();
        displayResponse('quick-response', data, response.ok);
      } catch (error) {
        displayResponse('quick-response', { error: error.message }, false);
      }
    }

    async function customRequest() {
      if (!token) {
        alert('Please login first!');
        return;
      }

      const method = document.getElementById('method').value;
      const endpoint = document.getElementById('endpoint').value;
      const body = document.getElementById('body').value;

      try {
        const options = {
          method: method,
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json',
          }
        };

        if (method !== 'GET' && body) {
          options.body = body;
        }

        const response = await fetch(`${BASE_URL}${endpoint}`, options);
        const data = await response.json();
        displayResponse('custom-response', data, response.ok);
      } catch (error) {
        displayResponse('custom-response', { error: error.message }, false);
      }
    }

    async function checkStatus() {
      try {
        const response = await fetch('http://localhost:5001/');
        const data = await response.json();
        displayResponse('status-response', {
          status: 'Backend is running ✅',
          message: data.message,
          port: 5001
        }, true);
      } catch (error) {
        displayResponse('status-response', {
          status: 'Backend is NOT running ❌',
          error: error.message,
          solution: 'Run: cd backend && npm run dev'
        }, false);
      }
    }

    function clearCache() {
      localStorage.clear();
      sessionStorage.clear();
      token = '';
      document.getElementById('token-display').innerHTML = '';
      displayResponse('cache-response', {
        message: 'Cache cleared successfully! ✅',
        cleared: ['localStorage', 'sessionStorage', 'token']
      }, true);
      setTimeout(() => {
        location.reload();
      }, 1500);
    }

    function displayResponse(elementId, data, success) {
      const element = document.getElementById(elementId);
      const statusClass = success ? 'success' : 'error';
      const statusText = success ? 'SUCCESS' : 'ERROR';
      
      element.innerHTML = `
        <span class="status ${statusClass}">${statusText}</span>
        <div class="response ${statusClass}">
          ${JSON.stringify(data, null, 2)}
        </div>
      `;
    }

    // Check backend status on load
    window.onload = () => {
      checkStatus();
    };
  </script>
</body>
</html>
